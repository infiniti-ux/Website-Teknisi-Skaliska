<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Inventaris Teknisi</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===================== LAYAR LOGIN ===================== -->
  <section id="login-screen" class="screen active">
    <div class="login-card">
      <img src="logo.png" alt="Logo" class="logo" onerror="this.style.visibility='hidden'" />
      <h1>Inventaris Teknisi</h1>
      <p class="subtitle">Masuk untuk mengelola peminjaman dan pengembalian barang</p>

      <form id="login-form" novalidate>
        <div class="f-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" autocomplete="username" required />
        </div>
        <div class="f-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Masuk</button>
        <p class="error-msg" id="login-error"></p>
      </form>
    </div>
  </section>

  <!-- ===================== SHELL APLIKASI ===================== -->
  <section id="app-screen" class="screen">
    <header class="app-header">
      <div class="header-left">
        <img src="logo.png" alt="Logo" class="logo-sm" onerror="this.style.visibility='hidden'" />
        <div class="header-text">
          <strong>Inventaris Teknisi</strong>
          <small id="current-user-info">-</small>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-outline btn-small">Keluar</button>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="main-content"></main>
  </section>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <!-- ===================== SDK FIREBASE ===================== -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
