<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
  <title>Teknisi Skaliska</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <!-- CONFIRM -->
  <div id="confirm" class="confirm hidden">
    <div class="confirm-box"><p id="confirm-msg"></p><div><button onclick="confirmOk()">Ya</button><button onclick="confirmCancel()">Batal</button></div></div>
  </div>

  <!-- LOGIN -->
  <div id="login" class="login-wrap">
    <div class="login-box">
      <img id="logo-login" src="" alt="Logo" class="logo-img">
      <h1>Teknisi Skaliska</h1>
      <p>Sistem Inventaris</p>
      <input id="user" placeholder="Username">
      <input id="pass" placeholder="Password" type="password">
      <p id="login-err" class="err hidden"></p>
      <button onclick="handleLogin()">Masuk</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app hidden">
    <header>
      <div class="header-left">
        <img id="logo-header" src="" alt="Logo" class="logo-header">
        <div>
          <h2>📦 Inventaris</h2>
          <span id="user-name">User</span>
          <span id="user-role" class="badge">Admin</span>
        </div>
      </div>
      <div class="header-actions">
        <button onclick="toggleMode()" title="Ganti mode tampilan">🔄</button>
        <button onclick="openSettings()" title="Pengaturan">⚙️</button>
        <button onclick="handleLogout()">🚪</button>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats">
      <div><span>Total Item</span><strong id="total-items">0</strong></div>
      <div id="low-stock" class="hidden"><span>⚠️ Stok Rendah</span><strong id="low-count">0</strong></div>
    </div>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="active" data-tab="gudang">📦 Gudang</button>
      <button data-tab="riwayat">📜 Riwayat</button>
      <button data-tab="pengguna" class="hidden">👥 Teknisi</button>
    </nav>

    <!-- Content -->
    <main>
      <div id="gudang-view">
        <div class="toolbar">
          <input id="search" placeholder="Cari..." oninput="renderGudang()">
          <button id="btn-add" class="btn-primary">+ Tambah</button>
        </div>
        <div class="filter">
          <button data-filter="semua" class="active">Semua</button>
          <button data-filter="tersedia">Tersedia</button>
          <button data-filter="habis">Habis</button>
        </div>
        <div id="gudang-list"></div>
      </div>
      <div id="riwayat-view" class="hidden">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
          <button id="clear-log" class="btn-primary" style="background:#dc2626;">Hapus Riwayat</button>
        </div>
        <div id="riwayat-list"></div>
      </div>
      <div id="pengguna-view" class="hidden">
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
          <button onclick="openUser()" class="btn-primary">+ Tambah Teknisi</button>
        </div>
        <div id="pengguna-list"></div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="active" data-tab="gudang">📦</button>
      <button data-tab="riwayat">📜</button>
      <button data-tab="pengguna" class="hidden">👥</button>
    </nav>
  </div>

  <!-- MODALS -->
  <div id="modal-barang" class="modal hidden"><div class="modal-box">
    <h3 id="modal-title">Tambah Barang</h3>
    <input id="b-nama" placeholder="Nama"><input id="b-kategori" placeholder="Kategori"><input id="b-stok" type="number" placeholder="Stok"><input id="b-lokasi" placeholder="Lokasi"><input id="b-gambar" placeholder="URL Gambar">
    <input type="hidden" id="b-id">
    <button onclick="saveBarang()">Simpan</button><button onclick="closeModal('modal-barang')">Batal</button>
  </div></div>

  <div id="modal-user" class="modal hidden"><div class="modal-box">
    <h3 id="user-modal-title">Tambah Teknisi</h3>
    <input id="u-nama" placeholder="Nama"><input id="u-pass" placeholder="Password">
    <input type="hidden" id="u-id">
    <button onclick="saveUser()">Simpan</button><button onclick="closeModal('modal-user')">Batal</button>
  </div></div>

  <div id="modal-settings" class="modal hidden"><div class="modal-box">
    <h3>Pengaturan Logo</h3>
    <input type="file" accept="image/*" onchange="previewLogo(this.files[0])">
    <button onclick="saveLogo()">Simpan Logo</button>
    <button onclick="resetLogo()">Reset</button>
    <button onclick="closeModal('modal-settings')">Tutup</button>
  </div></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
